<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorized Stream Recorder</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#0d1117;color:#e6edf3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}h1{margin:0 0 6px}.muted{color:#8b949e}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:24px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px}label{display:block;font-size:13px;color:#8b949e;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #30363d;background:#0d1117;color:#e6edf3}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;background:#238636;color:white;cursor:pointer;font-weight:650}button.secondary{background:#30363d}button.danger{background:#da3633}button:disabled{opacity:.45;cursor:not-allowed}.item{padding:14px 0;border-bottom:1px solid #30363d}.item:last-child{border-bottom:0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;background:#30363d}.ok{background:#1f6f43}.off{background:#6e2a2a}small{color:#8b949e}.notice{padding:12px;border-radius:10px;background:#1c2128;border:1px solid #30363d;margin-top:15px;font-size:13px}video{width:100%;max-height:360px;background:#000;border-radius:10px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Authorized Stream Recorder</h1><div class="muted">Consent-gated recording and automatic server storage.</div><div class="notice">Only add streamers for whom you have explicit permission to record and archive. The server checks the allowlist and expiry before starting a recording.</div><div class="grid"><section class="card"><h2>Add authorized streamer</h2><form id="form"><label>Name</label><input id="name" required><label>Platform</label><select id="platform"><option>Stripchat</option><option>Chaturbate</option><option>Other</option></select><label>Profile URL</label><input id="profileUrl" type="url"><label>Direct stream/HLS source URL</label><input id="sourceUrl" type="url" required placeholder="https://.../playlist.m3u8"><label>Permission date</label><input id="permissionDate" type="date" required><label>Permission expiry</label><input id="expiresAt" type="date"><label>Permission note/reference</label><textarea id="permissionNote"></textarea><button>Add to allowlist</button></form></section><main><section class="card"><div class="row"><h2>Authorized streamers</h2><button class="secondary" onclick="load()">Refresh</button></div><div id="streamers"></div></section><section class="card" style="margin-top:20px"><div class="row"><h2>Recordings</h2><button class="secondary" onclick="loadRecordings()">Refresh</button></div><div id="recordings"></div></section></main></div></div><script>
const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const l=await api("/api/streamers");$("streamers").innerHTML=l.length?l.map(s=>{const a=s.authorized&&(!s.expiresAt||new Date(s.expiresAt)>new Date());return '<div class="item"><div class="row"><strong>'+esc(s.name)+'</strong><span class="badge '+(a?"ok":"off")+'">'+(a?"AUTHORIZED":"INACTIVE")+'</span></div><small>'+esc(s.platform)+' · permission '+esc(s.permissionDate)+(s.expiresAt?" · expires "+esc(s.expiresAt):"")+'</small><div class="actions"><button '+(a?"":"disabled")+' onclick="record(\''+s.id+'\')">Record 1 hour</button><button class="secondary" onclick="toggle(\''+s.id+'\','+a+')">'+(a?"Revoke":"Authorize")+'</button><button class="danger" onclick="removeStreamer(\''+s.id+'\')">Delete</button></div></div>'}).join(""):"<p class='muted'>No streamers added.</p>"}
async function record(id){try{await api("/api/record",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({streamerId:id,duration:3600})});loadRecordings();alert("Recording started.")}catch(e){alert(e.message)}}async function toggle(id,a){await api("/api/streamers/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({authorized:!a})});load()}async function removeStreamer(id){if(confirm("Delete this streamer from the allowlist?")){await api("/api/streamers/"+id,{method:"DELETE"});load()}}
async function loadRecordings(){const l=await api("/api/recordings");$("recordings").innerHTML=l.length?l.map(r=>'<div class="item"><div class="row"><strong>'+esc(r.streamerName)+'</strong><span class="badge">'+esc(r.status)+'</span></div><small>'+new Date(r.startedAt).toLocaleString()+'</small>'+(r.status==="recording"?'<div class="actions"><button class="danger" onclick="stopRec(\''+r.id+'\')">Stop</button></div>':r.status==="complete"?'<video controls preload="metadata" src="'+esc(r.file)+'"></video><div class="actions"><a href="'+esc(r.file)+'" download><button>Download</button></a></div>':"")+'</div>').join(""):"<p class='muted'>No recordings yet.</p>"}async function stopRec(id){await api("/api/recordings/"+id+"/stop",{method:"POST"});setTimeout(loadRecordings,1000)}
$("form").onsubmit=async e=>{e.preventDefault();try{await api("/api/streamers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("name").value,platform:$("platform").value,profileUrl:$("profileUrl").value,sourceUrl:$("sourceUrl").value,permissionDate:$("permissionDate").value,expiresAt:$("expiresAt").value||null,permissionNote:$("permissionNote").value})});e.target.reset();load()}catch(err){alert(err.message)}};load();loadRecordings();setInterval(loadRecordings,5000);
</script></body></html>
