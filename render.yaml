services:
  - type: web
    name: youtube-search
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: YOUTUBE_API_KEYS
        sync: false
      - key: SEARCH_CACHE_TTL_HOURS
        value: "24"
